# این پروژه در همه‌ی سرویس‌ها (main_api, logging_service, notification_service,
# postgres_storage_service, timeseries_storage_service, telemetry_service) به
# صورت پیش‌فرض به amqp://guest:guest@rabbitmq:5672/ متصل می‌شود.
#
# کاربر guest به‌صورت پیش‌فرض در RabbitMQ فقط اجازه‌ی اتصال از طریق Loopback
# (یعنی از داخل همان کانتینر/هاست، نه از کانتینرهای دیگر در شبکه‌ی داکر) را دارد.
# چون در این پروژه همه‌ی سرویس‌ها از کانتینرهای جداگانه به rabbitmq وصل می‌شوند
# (نه از localhost)، بدون این تنظیم، تمام اتصالات با خطای
# "ACCESS_REFUSED - login was refused" رد می‌شدند.
#
# این تنظیم محدودیت را برمی‌دارد تا کاربر guest بتواند از سایر کانتینرهای
# همین شبکه‌ی داخلی (power_net) هم متصل شود.
loopback_users.guest = false
