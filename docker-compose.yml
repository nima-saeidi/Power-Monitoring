version: "3.8"

networks:
  power_net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  influxdb_data:
  mongodb_data:
  opensearch_data:
  graylog_data:

services:
  # 1. Database Service (TimescaleDB)
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: power_monitoring_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - power_net

  # 2. RabbitMQ Service
  rabbitmq:
    image: rabbitmq:3-management
    container_name: power_monitoring_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      TZ: ${TZ}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - power_net

  # 3. InfluxDB Service
  influxdb:
    image: influxdb:2.7-alpine
    container_name: power_monitoring_influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
      TZ: ${TZ}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "-sI", "http://localhost:8086/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - power_net

  # 4. MongoDB Service for Graylog
  mongodb:
    image: mongo:4.4
    container_name: power_monitoring_mongo
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - power_net

  # 5. OpenSearch Service for Graylog
  opensearch:
    image: opensearchproject/opensearch:1.3.14
    container_name: power_opensearch
    restart: unless-stopped
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "action.auto_create_index=false"
      - "plugins.security.disabled=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - power_net

  # 6. Graylog Service
  graylog:
    image: graylog/graylog:4.3
    container_name: power_monitoring_graylog
    restart: unless-stopped
    environment:
      - GRAYLOG_NODE_ID_FILE=/usr/share/graylog/data/config/node-id
      - GRAYLOG_ROOT_PASSWORD_SHA2=${GRAYLOG_ROOT_PASSWORD_SHA2}
      - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_PASSWORD_SECRET}
      - GRAYLOG_HTTP_BIND_ADDRESS=0.0.0.0:9000
      - GRAYLOG_HTTP_EXTERNAL_URI=http://localhost:9000/
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch:9200
      - GRAYLOG_MONGODB_URI=mongodb://mongodb:27017/graylog
      - TZ=${TZ}
    ports:
      - "9000:9000"
      - "12201:12201/udp"
      - "12201:12201/tcp"
    volumes:
      - graylog_data:/usr/share/graylog/data
    depends_on:
      - mongodb
      - opensearch
    networks:
      - power_net

  # 7. Main API Service
  api:
    build:
      context: ./api_service  # <--- مسیر پوشه سرویس اصلی شما
      dockerfile: Dockerfile
    container_name: power_monitoring_api
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      GRAYLOG_HOST: graylog
      GRAYLOG_PORT: 12201
      TZ: ${TZ}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      graylog:
        condition: service_started
    networks:
      - power_net

  # 8. Logging Service
  logging:
    build:
      context: ./logging_service
      dockerfile: Dockerfile
    container_name: power_monitoring_logging
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      GRAYLOG_HOST: graylog
      GRAYLOG_PORT: 12201
      GRAYLOG_API_URL: http://graylog:9000/api
      GRAYLOG_USER: ${GRAYLOG_API_USER}
      GRAYLOG_PASSWORD: ${GRAYLOG_API_PASSWORD}
      TZ: ${TZ}
    depends_on:
      rabbitmq:
        condition: service_healthy
      graylog:
        condition: service_started
    networks:
      - power_net

  # 9. Telemetry Service
  telemetry:
    build:
      context: ./telemetry_service
      dockerfile: Dockerfile
    container_name: power_monitoring_telemetry
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      MAIN_API_URL: http://api:8000
      POLLING_INTERVAL: 5
      MAX_TELEMETRY_FAILURES: 3
      GRAYLOG_HOST: graylog
      GRAYLOG_PORT: 12201
      TZ: ${TZ}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      graylog:
        condition: service_started
      api:
        condition: service_started
    networks:
      - power_net
