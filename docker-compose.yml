version: "3.8"

networks:
  power_net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  influxdb_data:
  mongodb_data:
  opensearch_data:
  graylog_data:

services:
  # 1. Database Service (TimescaleDB)
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: power_monitoring_db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - power_net

  # 2. RabbitMQ Service
  rabbitmq:
    image: rabbitmq:3-management
    container_name: power_monitoring_rabbitmq
    restart: unless-stopped
    env_file: .env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - power_net

  # 3. InfluxDB Service
  influxdb:
    image: influxdb:2.7-alpine
    container_name: power_monitoring_influxdb
    restart: unless-stopped
    env_file: .env
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "-sI", "http://localhost:8086/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - power_net

  # 4. MongoDB Service
  mongodb:
    image: mongo:4.4
    container_name: power_monitoring_mongo
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - power_net

  # 5. OpenSearch Service
  opensearch:
    image: opensearchproject/opensearch:1.3.14
    container_name: power_opensearch
    restart: unless-stopped
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "action.auto_create_index=false"
      - "plugins.security.disabled=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - power_net

  # 6. Graylog Service
  graylog:
    image: graylog/graylog:4.3
    container_name: power_monitoring_graylog
    restart: unless-stopped
    env_file: .env
    ports:
      - "9000:9000"
      - "12201:12201/udp"
      - "12201:12201/tcp"
    volumes:
      - graylog_data:/usr/share/graylog/data
    depends_on:
      - mongodb
      - opensearch
    networks:
      - power_net

  # 7. Main API Service
  api:
    build:
      context: .
      dockerfile: ./main_api/Dockerfile
    container_name: power_monitoring_api
    restart: unless-stopped
    command: bash -c "alembic -c main_api/alembic.ini upgrade head && uvicorn main_api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      graylog:
        condition: service_started
    networks:
      - power_net

  # 8. Logging Service
  logging:
    build:
      context: ./logging_service
      dockerfile: Dockerfile
    container_name: power_monitoring_logging
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      graylog:
        condition: service_started
    networks:
      - power_net

  # 9. Telemetry Service
  telemetry:
    build:
      context: ./telemetry_service
      dockerfile: Dockerfile
    container_name: power_monitoring_telemetry
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      graylog:
        condition: service_started
      api:
        condition: service_started
    networks:
      - power_net
