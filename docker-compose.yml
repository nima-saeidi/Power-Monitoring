version: '3.8'

services:
  # 1. سرویس دیتابیس (TimescaleDB)
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: power_monitoring_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: power_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. سرویس پیام‌رسان (Redis Broker برای Pub/Sub)
  redis:
    image: redis:alpine
    container_name: redis_broker
    restart: always
    ports:
      - "6379:6379"

  # 3. سرویس بک‌اند اصلی (Core - Subscriber & WebSocket Manager)
  api:
    build: ./main_api
    container_name: power_monitoring_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:admin@db:5432/power_monitoring
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your_super_secret_key
    depends_on:
      - db
      - redis
    # volumes:
    #   - ./main_api:/app

  # 4. سرویس تله‌متری (Modbus Reader & Publisher)
  telemetry:
    build: ./telemetry_service
    container_name: power_monitoring_telemetry
    restart: always
    # در صورت نیاز به بررسی وضعیت این سرویس، می‌توانید پورت زیر را باز کنید
    # ports:
    #   - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:admin@db:5432/power_monitoring
      REDIS_URL: redis://redis:6379/0
      POLLING_INTERVAL: 5
      MAX_TELEMETRY_FAILURES: 3
    depends_on:
      - db
      - redis
    # volumes:
    #   - ./telemetry_service:/app

volumes:
  postgres_data:
