networks:
  power_net:
    driver: bridge

services:
  # 1. Database Service (TimescaleDB) - برای داده‌های رابطه‌ای و تنظیمات
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: power_monitoring_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/6:8086"
    volumes:
      - influxdb_data:/var/lib/infl      test: ["CMD-SHELL", "pg_isready -U postgres -d power_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - power_net

  # 2. Redis Broker Service - برای مدیریت صف و پیام‌ها
  redis:
    image: redis:alpine
    container_name: redis_broker
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - power_net

  # 3. InfluxDB Service - دیتابیس تخصصی سری‌زمانی برای تلمتری
  influxdb:
    image: influxdb:2.7-alpine
    container_name: power_monitoring_influxdb
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "curl", "-sI", "http://localhost:8086/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - power_net

  # 4. MongoDB Service - پیش‌نیاز Graylog برای ذخیره متادیتا
  mongodb:
    image: mongo:6.0
    container_name: power_monitoring_mongo
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - power_net

  # 5. OpenSearch Service - موتور جستجو و ایندکس لاگ‌ها برای Graylog
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: power_opensearch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "bootstrap.memory_lock=true"
      - "discovery.type=single-node"
      - "action.auto_create_index=false"
      - "plugins.security.ssl.http.enabled=false"
      - "plugins.security.disabled=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - power_net

  # 6. Graylog Service - مدیریت متمرکز لاگ‌ها
  graylog:
    image: graylog/graylog:5.2
    container_name: power_monitoring_graylog
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mongodb
      - opensearch
    ports:
      - "9000:9000"       # وب پنل Graylog و REST API
      - "12201:12201/udp" # پورت دریافت لاگ GELF UDP
      - "12201:12201/tcp" # پورت دریافت لاگ GELF TCP
    volumes:
      - graylog_data:/usr/share/graylog/data
    networks:
      - power_net

  # 7. API Service - سرویس اصلی
  api:
    build:
      context: .
      dockerfile: ./main_api/Dockerfile
    container_name: power_monitoring_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      graylog:
        condition: service_started
      telemetry:
        condition: service_started # اطمینان از بالا بودن سرویس تلماتری برای پروکسی
    command: bash -c "alembic -c main_api/alembic.ini upgrade head && uvicorn main_api.main:app --host 0.0.0.0 --port 8000"
    networks:
      - power_net

  # 8. Telemetry Service (Modbus Reader & Chart API)
  telemetry:
    build:
      context: ./telemetry_service
    container_name: power_monitoring_telemetry
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8000" # پورت ۸۰۰۱ هاست به ۸۰۰۰ کانتینر متصل شد تا API این سرویس در دسترس باشد
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      graylog:
        condition: service_started
    networks:
      - power_net

volumes:
  postgres_data:
  influxdb_data:
  mongodb_data:
  opensearch_data:
  graylog_data:
